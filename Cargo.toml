[package]
name = "homepod-sink"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-stream = "0.3"
tokio-stream = "0.1"

# Networking
mdns-sd = "0.11"

# Cryptography (AirPlay 2 HomeKit pairing + RTP audio encryption)
rand = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
curve25519-dalek = { version = "4.1", features = ["digest"] }
chacha20poly1305 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
ctr = "0.9"
sha2 = "0.10"
hkdf = "0.12"
num-bigint = { version = "0.4", features = ["rand"] }
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"

# Serialization (RTSP binary plists, mDNS TXT records, saved pairing identity)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
plist = "1.6"
uuid = { version = "1.8", features = ["v4", "serde"] }
base64 = "0.22"

# Audio
symphonia = { version = "0.5", features = ["all"] }
alac-encoder = "0.3"
rubato = "0.15"
fastrand = "2.0"
biquad = "0.4"
rustfft = "6"
crossbeam-channel = "0.5"
spin_sleep = "1.2"

# Error handling
thiserror = "1.0"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# PipeWire capture
pipewire = { version = "0.10", features = ["v0_3_65"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
futures = "0.3"
tokio-test = "0.4"
mockall = "0.12"
hex = "0.4"
hound = "3.5"
tempfile = "3.10"
