# On every push to master: build and test for x86_64 and aarch64, and
# publish the tarballs plus a manifest (version and checksums) to the
# rolling "latest" release. arch/PKGBUILD reads that
# manifest, so nothing gets committed back.
name: Release

on:
  push:
    branches: [master]
    # Nothing in the binaries or the tarball changes: docs, and the
    # PKGBUILDs (which read the release, they aren't part of it).
    paths-ignore: ['**.md', 'arch/**', '.gitignore']
  workflow_dispatch:

# One release at a time: each run moves the "latest" tag and replaces its
# assets, so runs must not interleave. Queued runs wait, they aren't cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for the r<commit count> version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev libclang-dev clang pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - run: cargo test --release --locked
      - run: cargo build --release --locked --bin homepod-sink --bin play

      - name: Package
        run: |
          version="r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          scripts/dist.sh "$version" ${{ matrix.arch }} dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Version
        id: version
        run: echo "version=r$(git rev-list --count "$GITHUB_SHA").$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Publish to the "latest" release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --title "Latest build" --notes "Rolling build of master."
          fi
          gh release upload latest dist/*.tar.gz dist/*.sha256 --clobber
          # The manifest last, so it never names tarballs that aren't up yet.
          scripts/manifest.sh "$VERSION" dist
          gh release upload latest dist/manifest --clobber
          gh release edit latest --notes "Rolling build of master, currently $VERSION ($GITHUB_SHA)."

      - name: Prune older assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view latest --json assets --jq '.assets[].name' |
            grep -v -e "-$VERSION-" -e '^manifest$' |
            xargs -r -n1 gh release delete-asset latest --yes
